<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kanban Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
     <link rel="stylesheet" href="./src/output.css">
</head>


<body class="p-0 m-0 ">
    <section  class="flex flex-row   p-8 justify-around  ">

       

       <div class="w-1/2">

  <div class="flex flex-col ">
    <h1> <i class="fa-solid fa-layer-group pr-4 "></i> Mon Tableau Kanban</h1>
    <p>Suivez vos tâches en toute simplicité</p>
    </div>
       </div>


     

    <div class=" w-1/2 flex items-center gap-2 border-2 border-solid border-gray-300  h-10 rounded">
    <i class="fa-solid fa-magnifying-glass"></i>
    <input type="text" placeholder="Recherche une carte" class="outline-none ">

</div>
    

    </section>

    <section class="flex p-8">
        <div class="w-1/2">
            <button class="bg-green-700 font-bold text-amber-50 rounded w-40 cursor-pointer h-10 text-center">➕Nouvelle Carte</button>
        </div>
        <div class="flex justify-evenly gap-4">
            <div>
            <select id="priorite" class="border-2 border-solid border-gray-300 w-40 h-10 rounded" >
    <option value="all " >Toutes les priorités</option>
    <option value="Sara">Haute</option>
    <option value="Ahmed">Moyenne</option>
    <option value="Aya">Basse</option>
</select>
      </div>
      <div>
            <select id="assignee" class="border-2 border-solid border-gray-300 w-40 h-10 rounded">
    <option value="all">Tous les membres</option>
    <option value="Sara">Sara</option>
    <option value="Ahmed">Ahmed</option>
    <option value="Aya">Aya</option>
</select>
</div>  
        </div>
    </section>
 <section class="grid grid-cols-1 md:grid-cols-3 gap-6 p-6">

   
    <div id="AFaire" class="bg-amber-50 rounded-xl p-5 shadow-sm border border-amber-200">

        <div class="flex items-center justify-between border-b border-amber-200 pb-3">
            <h3 class="font-bold text-amber-700 flex items-center gap-2">
                <i class="fa-solid fa-pen-to-square"></i>
                À faire
            </h3>
            <span class="bg-amber-200 text-amber-800 rounded-full px-3 py-1 text-sm">0</span>
        </div>

    </div>

 
    <div id="EnCour" class="bg-blue-50 rounded-xl p-5 shadow-sm border border-blue-200">

        <div class="flex items-center justify-between border-b border-blue-200 pb-3">
            <h3 class="font-bold text-blue-700 flex items-center gap-2">
                <i class="fa-solid fa-bars-progress"></i>
                En cours
            </h3>
            <span class="bg-blue-200 text-blue-800 rounded-full px-3 py-1 text-sm">0</span>
        </div>

    </div>


    <div id="Termine" class="bg-green-50 rounded-xl p-5 shadow-sm border border-green-200">

        <div class="flex items-center justify-between border-b border-green-200 pb-3">
            <h3 class="font-bold text-green-700 flex items-center gap-2">
                <i class="fa-solid fa-list-check"></i>
                Terminé
            </h3>
            <span class="bg-green-200 text-green-800 rounded-full px-3 py-1 text-sm">0</span>
        </div>

    </div>

</section>
   
</body>
</html>
